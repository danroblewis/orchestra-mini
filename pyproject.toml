[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orchestra"
version = "2.0.0a1"
description = "A dumb system: runs commands, reads their stdout, keeps an event bus and a metrics store."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
bus-redis = ["redis>=5.0"]
bus-rabbitmq = ["pika>=1.3"]
bus-kafka = ["confluent-kafka>=2.5"]
bus = ["redis>=5.0", "pika>=1.3", "confluent-kafka>=2.5"]

[project.scripts]
orchestra = "orchestra.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["orchestra"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B023"]
ignore = ["E741"]
